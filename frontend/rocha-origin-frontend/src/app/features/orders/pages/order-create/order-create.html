<mat-card>
    <mat-card-title class="page-title">
        Criar Encomenda
    </mat-card-title>

    <mat-card-content>
        <form [formGroup]="form">

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Cliente ID</mat-label>
                <input matInput formControlName="clientId">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Data de preparação</mat-label>
                <input matInput type="date" formControlName="prepDate">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Data de entrega</mat-label>
                <input matInput type="date" formControlName="deliveryDate">
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Hora limite</mat-label>
                <input matInput type="time" formControlName="deliveryDeadlineTime">
            </mat-form-field>

            <mat-checkbox formControlName="isUrgent">
                Urgente
            </mat-checkbox>

            <button mat-raised-button color="primary" type="button" (click)="submit()" [disabled]="form.invalid">
                Criar Encomenda
            </button>

        </form>
    </mat-card-content>
</mat-card>
