<div class="login-shell">
  <div class="login-backdrop"></div>

  <section class="login-card">
    <div class="brand-mark">RO</div>

    <p class="eyebrow">Rocha Origin</p>
    <h1>Entrar na plataforma</h1>
    <p class="subtitle">
      Gestão de encomendas, clientes, produtos e produção num único fluxo.
    </p>

    <button
      mat-raised-button
      type="button"
      class="login-button"
      (click)="login()"
    >
      Entrar
    </button>

    <div class="config-warning">
      <strong>Modo preview ativo.</strong>
      <span>O botão entra localmente na app. A integração Auth0 fica para a próxima fase.</span>
    </div>
  </section>
</div>
