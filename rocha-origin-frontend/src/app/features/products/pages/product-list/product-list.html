<app-list-page
  title="Produtos"
  addLabel="Novo produto"
  [dataSource]="dataSource"
  [displayedColumns]="displayedColumns"
  [pageSize]="10"
  (add)="onAddProduct()"
>
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let row">{{ row.id }}</td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Produto</th>
    <td mat-cell *matCellDef="let row">{{ row.name }}</td>
  </ng-container>

  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef>Categoria</th>
    <td mat-cell *matCellDef="let row">{{ row.category }}</td>
  </ng-container>

  <ng-container matColumnDef="defaultUnit">
    <th mat-header-cell *matHeaderCellDef>Unidade</th>
    <td mat-cell *matCellDef="let row">{{ row.defaultUnit }}</td>
  </ng-container>

  <ng-container matColumnDef="defaultPrice">
    <th mat-header-cell *matHeaderCellDef>Preco Base</th>
    <td mat-cell *matCellDef="let row">{{ row.defaultPrice | currency: 'EUR' : 'symbol' : '1.2-2' }}</td>
  </ng-container>

  <ng-container matColumnDef="vatRate">
    <th mat-header-cell *matHeaderCellDef>IVA</th>
    <td mat-cell *matCellDef="let row">{{ row.vatRate }}%</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let row">
      <span class="status-pill" [class.status-active]="row.status === 'Ativo'">
        {{ row.status }}
      </span>
    </td>
  </ng-container>
</app-list-page>
