<app-list-page title="Clientes" addLabel="Novo cliente" [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [pageSize]="20" (add)="onAddClient()">
  <app-list-filters
    filters
    [searchText]="searchText"
    (searchTextChange)="searchText = $event"
    searchPlaceholder="Nome, NIF, email ou telefone"
    [cityOptions]="cityOptions"
    [cityValue]="cityFilter"
    (cityValueChange)="setCityFilter($event)"
    [paymentOptions]="paymentTypeOptions"
    [paymentValue]="paymentTypeFilter"
    (paymentValueChange)="setPaymentTypeFilter($event)"
    [sortOptions]="sortOptions"
    [sortValue]="sortBy"
    (sortValueChange)="setSortBy($event)"
    (changed)="applyFilters()"
    (clear)="clearFilters()"
  ></app-list-filters>

  <ng-container matColumnDef="companyName">
    <th mat-header-cell *matHeaderCellDef>Empresa</th>
    <td mat-cell class="text-bold-table" *matCellDef="let row">{{ row.companyName }}</td>
  </ng-container>

  <ng-container matColumnDef="vatNumber">
    <th mat-header-cell *matHeaderCellDef>NIF</th>
    <td mat-cell *matCellDef="let row">{{ row.vatNumber }}</td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Telefone</th>
    <td mat-cell *matCellDef="let row">{{ row.phone }}</td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>Cidade</th>
    <td mat-cell *matCellDef="let row">{{ row.city }}</td>
  </ng-container>

  <ng-container matColumnDef="paymentType">
    <th mat-header-cell *matHeaderCellDef>Pagamento</th>
    <td mat-cell *matCellDef="let row">{{ row.paymentTypeLabel }}</td>
  </ng-container>
</app-list-page>
