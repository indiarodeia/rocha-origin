<app-list-page title="Fornecedores" addLabel="Novo fornecedor" [dataSource]="dataSource"
  [displayedColumns]="displayedColumns" [pageSize]="10" (add)="onAddSupplier()">
  <app-list-filters
    filters
    [searchText]="searchText"
    (searchTextChange)="searchText = $event"
    searchPlaceholder="Nome, NIF, código, telefone ou email"
    [cityOptions]="cityOptions"
    [cityValue]="cityFilter"
    (cityValueChange)="setCityFilter($event)"
    [sortOptions]="sortOptions"
    [sortValue]="sortBy"
    (sortValueChange)="setSortBy($event)"
    (changed)="applyFilters()"
    (clear)="clearFilters()"
  ></app-list-filters>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>Nome</th>
    <td mat-cell class="text-bold-table" *matCellDef="let row">{{ row.name }}</td>
  </ng-container>

  <ng-container matColumnDef="explorationCode">
    <th mat-header-cell *matHeaderCellDef>Código Exploração</th>
    <td mat-cell *matCellDef="let row">{{ row.explorationCode }}</td>
  </ng-container>

  <ng-container matColumnDef="city">
    <th mat-header-cell *matHeaderCellDef>Cidade</th>
    <td mat-cell *matCellDef="let row">{{ row.city }}</td>
  </ng-container>

  <ng-container matColumnDef="phone">
    <th mat-header-cell *matHeaderCellDef>Telefone</th>
    <td mat-cell *matCellDef="let row">{{ row.phone }}</td>
  </ng-container>

  <ng-container matColumnDef="certifications">
    <th mat-header-cell *matHeaderCellDef>Certificações</th>
    <td mat-cell *matCellDef="let row" class="certifications-cell">{{ row.certifications }}</td>
  </ng-container>
</app-list-page>
