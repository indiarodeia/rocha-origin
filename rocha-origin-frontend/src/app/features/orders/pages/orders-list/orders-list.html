<app-list-page
  title="Encomendas"
  addLabel="Nova encomenda"
  [dataSource]="dataSource"
  [displayedColumns]="displayedColumns"
  [pageSize]="10"
  (add)="onAddOrder()"
>
  <app-list-filters
    filters
    [searchText]="searchText"
    (searchTextChange)="searchText = $event"
    searchPlaceholder="Restaurante, ID ou produto"
    cityLabel="Rota"
    [cityOptions]="[]"
    [cityValue]="selectedRouteIds"
    [cityMultiple]="true"
    [cityShowAllOption]="false"
    [paymentLabel]="'Estado'"
    [paymentOptions]="statusFilterOptions"
    [paymentValue]="selectedStatuses"
    [paymentMultiple]="true"
    [paymentShowAllOption]="false"
    sortLabel="Tipo"
    [sortOptions]="typeFilterOptions"
    [sortValue]="typeFilter"
    [sortShowAllOption]="true"
    sortAllLabel="Todos"
    (cityValueChange)="setSelectedRouteIds($event)"
    (paymentValueChange)="setSelectedStatuses($event)"
    (sortValueChange)="setTypeFilter($event)"
    (changed)="applyFilters()"
    (clear)="clearFilters()"
  >
    <mat-form-field filters-extra appearance="outline" class="filter-field">
      <mat-label>Rota</mat-label>
      <mat-select panelClass="filters-panel" multiple [ngModel]="selectedRouteIds" (ngModelChange)="setSelectedRouteIds($event); applyFilters()">
        <mat-option *ngFor="let route of routeFilterOptions" [value]="route.value">
          {{ route.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <label filters-extra class="filter-checkbox">
      <input type="checkbox" [(ngModel)]="hideDelivered" (change)="applyFilters()">
      <span>Ocultar entregues</span>
    </label>
  </app-list-filters>

  <ng-container matColumnDef="restaurant">
    <th mat-header-cell *matHeaderCellDef>Restaurante</th>
    <td mat-cell *matCellDef="let row">{{ row.restaurant }}</td>
  </ng-container>

  <ng-container matColumnDef="route">
    <th mat-header-cell *matHeaderCellDef>Rota</th>
    <td mat-cell *matCellDef="let row">
      <span class="route-chip" [ngClass]="routeChipClass(row.routeId)">
        {{ row.routeName }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="products">
    <th mat-header-cell *matHeaderCellDef>Produtos</th>
    <td mat-cell *matCellDef="let row" class="products-cell">{{ row.products }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let row">
      <span class="status-pill" [ngClass]="statusClass(row.status)">
        {{ statusLabel(row.status) }}
      </span>
    </td>
  </ng-container>

  <ng-container matColumnDef="deliveryDateTime">
    <th mat-header-cell *matHeaderCellDef class="sortable-header" (click)="toggleDeliverySort()">
      <span>Entrega</span>
      <mat-icon>{{ deliverySortIcon() }}</mat-icon>
    </th>
    <td mat-cell *matCellDef="let row">{{ row.deliveryDateTime | date: 'dd/MM/yyyy HH:mm' }}</td>
  </ng-container>

  <ng-container matColumnDef="flags">
    <th mat-header-cell *matHeaderCellDef>Tipo</th>
    <td mat-cell *matCellDef="let row" class="flags-cell">
      <div class="flags-wrap">
        <span class="flag" [class.flag-delivery]="row.isDelivery">
          {{ row.isDelivery ? 'Entrega' : 'Recolha' }}
        </span>
        <span class="flag flag-urgent" *ngIf="row.isUrgent">Urgente</span>
      </div>
    </td>
  </ng-container>

</app-list-page>
